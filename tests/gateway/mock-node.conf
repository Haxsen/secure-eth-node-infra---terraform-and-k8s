# Mock execution client for gateway tests: echoes back what geth would see
# (Host header, any leaked credential headers, X-Forwarded-For).
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    access_log off;

    server {
        listen 8545;

        location / {
            default_type application/json;
            content_by_lua_block {
                local cjson = require("cjson")
                ngx.req.read_body()
                ngx.say(cjson.encode({
                    jsonrpc = "2.0",
                    id = 1,
                    result = {
                        host = ngx.var.http_host or "",
                        api_key = ngx.var.http_x_api_key or "",
                        authorization = ngx.var.http_authorization or "",
                        xff = ngx.var.http_x_forwarded_for or "",
                    },
                }))
            }
        }
    }
}
