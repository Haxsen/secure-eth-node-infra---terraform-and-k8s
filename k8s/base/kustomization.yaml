apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Network-neutral base. Deploy an overlay (k8s/overlays/<env>), never the base:
# placeholder values here ("set-in-overlay") make the clients fail fast.
resources:
  - namespaces.yaml
  - eth-node
  - validator
  - rpc-gateway

labels:
  - pairs:
      app.kubernetes.io/part-of: eth-platform
    includeSelectors: false
