# -----------------------------------------------------------------------------
# Public JSON-RPC gateway (OpenResty).
#
#   ALB (TLS, WAF) -> [this] -> eth-node-rpc:8545
#
# Responsibilities, in request order:
#   rewrite    : identify tenant from API key hash  (rpc_guard.identify)
#   preaccess  : per-IP and per-API-key rate limits (limit_req / limit_conn)
#   access     : reject unauthenticated + JSON-RPC firewall (rpc_guard.enforce)
#   content    : proxy to the internal node pool
# -----------------------------------------------------------------------------
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 4096;
}

http {
    default_type application/json;
    server_tokens off;
    more_clear_headers Server;

    # No API keys in logs: only the key's *name* is logged.
    log_format rpc_json escape=json
        '{"ts":"$time_iso8601","client":"$remote_addr","api_key":"$api_key_name",'
        '"status":$status,"methods":"$rpc_methods","req_bytes":$request_length,'
        '"resp_bytes":$bytes_sent,"latency_s":$request_time,'
        '"upstream_latency_s":"$upstream_response_time"}';
    access_log /dev/stdout rpc_json;

    # Read-only root filesystem: every writable path lives on the /tmp emptyDir.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # --- Request hygiene (slowloris / oversized payload mitigation) -----------
    client_max_body_size        128k;
    client_body_buffer_size     128k;   # == max body: bodies are never spooled to disk
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                15s;
    keepalive_timeout           30s;
    keepalive_requests          1000;
    reset_timedout_connection   on;

    # The ALB appends the client IP to X-Forwarded-For. Only ALB subnets can
    # reach this pod (NetworkPolicy), so trusting the VPC range is safe and
    # rate limits key on the real client address, not the ALB node.
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # --- Lua JSON-RPC firewall ---------------------------------------------------
    lua_package_path "/etc/openresty/lua/?.lua;;";
    init_by_lua_block        { require("rpc_guard").init() }
    init_worker_by_lua_block { require("rpc_guard").init_worker() }

    # --- Rate limiting --------------------------------------------------------------
    # Unauthenticated traffic (key brute force) is bounded by the per-IP zone;
    # authenticated tenants are additionally bounded per key.
    limit_req_zone  $binary_remote_addr zone=per_ip:10m  rate=50r/s;
    limit_req_zone  $api_key_name       zone=per_key:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    upstream eth_rpc {
        server eth-node-rpc.eth-nodes.svc.cluster.local:8545;
        keepalive 64;
        keepalive_timeout 60s;
    }

    server {
        listen 8080;
        server_name _;

        set $api_key_name "";
        set $rpc_methods  "";

        error_page 429 = @rate_limited;
        error_page 413 = @too_large;

        # ALB + kubelet health check. 503 until API keys are loaded (fail closed).
        location = /healthz {
            access_log off;
            content_by_lua_block { require("rpc_guard").healthz() }
        }

        location = / {
            limit_conn conn_per_ip 50;
            limit_req  zone=per_ip  burst=100 nodelay;
            limit_req  zone=per_key burst=200 nodelay;

            rewrite_by_lua_block { require("rpc_guard").identify() }
            access_by_lua_block  { require("rpc_guard").enforce() }

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # geth enforces --http.vhosts; present the internal name it expects.
            proxy_set_header Host "eth-node-rpc.eth-nodes.svc.cluster.local";
            # Never forward client credentials to the node.
            proxy_set_header X-Api-Key "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 2s;
            proxy_send_timeout    10s;
            proxy_read_timeout    30s;
            proxy_max_temp_file_size 0;
            proxy_hide_header X-Powered-By;

            proxy_pass http://eth_rpc;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"jsonrpc":"2.0","id":null,"error":{"code":-32005,"message":"rate limit exceeded"}}';
        }

        location @too_large {
            default_type application/json;
            return 413 '{"jsonrpc":"2.0","id":null,"error":{"code":-32600,"message":"request body too large"}}';
        }

        location / {
            return 404 '{"jsonrpc":"2.0","id":null,"error":{"code":-32601,"message":"not found"}}';
        }
    }
}
