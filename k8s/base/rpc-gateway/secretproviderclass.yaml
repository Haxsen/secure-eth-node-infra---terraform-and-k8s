# {"<sha256(api key)>": "<tenant name>", ...}. Plaintext keys are never stored.
# The CSI driver re-fetches every 2m (rotation enabled) and rpc_guard reloads
# the file every 30s, so adding or revoking a key needs no restart.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rpc-gateway-api-keys
spec:
  provider: aws
  parameters:
    region: set-in-overlay
    objects: |
      - objectName: "set-in-overlay/rpc-gateway/api-keys"
        objectType: "secretsmanager"
        objectAlias: "api-keys.json"
