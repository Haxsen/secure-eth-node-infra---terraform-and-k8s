apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eth-nodes

resources:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - statefulset.yaml
  - services.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: eth-network
    literals:
      - ETH_NETWORK=set-in-overlay
      - CHECKPOINT_SYNC_URL=set-in-overlay
