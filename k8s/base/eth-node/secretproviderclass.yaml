# Engine API JWT, mounted as a tmpfs file by the Secrets Store CSI driver using
# the pod's own IRSA identity. Never synced into a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eth-node-jwt
spec:
  provider: aws
  parameters:
    region: set-in-overlay
    objects: |
      - objectName: "set-in-overlay/jwt-secret"
        objectType: "secretsmanager"
        objectAlias: "jwt.hex"
