# Validator keystores (base64 tar.gz bundle of EIP-2335 keystore-*.json) and
# their password, fetched from Secrets Manager with the validator pod's IRSA
# identity and mounted as tmpfs files. Never synced to a Kubernetes Secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: validator-keys
spec:
  provider: aws
  parameters:
    region: set-in-overlay
    objects: |
      - objectName: "set-in-overlay/validator/keystores"
        objectType: "secretsmanager"
        objectAlias: "keystores.tar.gz.b64"
      - objectName: "set-in-overlay/validator/keystore-password"
        objectType: "secretsmanager"
        objectAlias: "keystore-password"
