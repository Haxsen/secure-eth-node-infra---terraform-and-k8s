# Secret names follow the Terraform convention eth-<environment>/<suffix>.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eth-node-jwt
  namespace: eth-nodes
spec:
  parameters:
    objects: |
      - objectName: "eth-mainnet/jwt-secret"
        objectType: "secretsmanager"
        objectAlias: "jwt.hex"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: validator-keys
  namespace: eth-validator
spec:
  parameters:
    objects: |
      - objectName: "eth-mainnet/validator/keystores"
        objectType: "secretsmanager"
        objectAlias: "keystores.tar.gz.b64"
      - objectName: "eth-mainnet/validator/keystore-password"
        objectType: "secretsmanager"
        objectAlias: "keystore-password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rpc-gateway-api-keys
  namespace: rpc-gateway
spec:
  parameters:
    objects: |
      - objectName: "eth-mainnet/rpc-gateway/api-keys"
        objectType: "secretsmanager"
        objectAlias: "api-keys.json"
